name: test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 20 is the engine floor in package.json and the oldest line worth
        # keeping; 24 is current. magpie runs plugins on Bun, so that is
        # tested too — it is the runtime the tests are least able to stand in
        # for.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  bun:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      # the tarball-gate tests run here too, and the gate packs with npm and
      # runs the packed suite with node (scripts/tarball.mjs), so the Bun job
      # needs a Node and an npm it can find rather than whatever the image
      # happens to have
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: bun test

  # the suite must pass from the published artifact, not only from a checkout:
  # `files` is what decides what ships, and a test that references a file
  # outside it passes here and fails for every user. 0.1.2 was exactly that.
  # It also gets the native job's builds, so the gate stages the five platform
  # packages from them and installs the packed main package against them; with
  # a bare checkout it would check none and still pass.
  tarball:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-bin
          path: native/bin
      # upload/download-artifact carries bytes, not modes: the builds come
      # back read-only, and the gate rightly refuses a package whose proxy
      # cannot be run. A local build leaves them executable; restore that.
      - run: chmod +x native/bin/*
      # -check reads a file's shape and mtime; --buildinfo reads its own build
      # record (this repo's proxy, the platform, the toolchain, the sidecar's
      # DefaultGODEBUG) and the manifest's sha256 for the bytes. This is the
      # only step that reads the artifact after it crossed jobs, so it runs
      # both: a linux build copied under five names passed --buildinfo alone
      # (2026-11-27 review).
      - run: node scripts/build-native.mjs --check --strict
      - run: node scripts/build-native.mjs --buildinfo
      - run: node scripts/tarball.mjs --require-bun

  # the plugin reads a file under the user's home directory on every platform
  # (the read-from-this-machine sign-in), and ~ is where the bugs live
  windows:
    # the installed-proxy check below needs the win32 build the native job
    # makes; nothing else in this job depends on it
    needs: native
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: node --test
      # The suite skips every test that starts a proxy on Windows (there is no
      # native/bin here), so the win32 half of the start path — the tcp ready,
      # its `127.0.0.1:<port>` check, the pid comparison against the child —
      # would never run anywhere. This drives it with a fixture proxy that
      # binds the way the Windows Go build does.
      - run: node scripts/check-proxy-start.mjs
      # The suite's packed-install test is skipped on Windows (npm is a .cmd
      # shim and that check's own local registry cannot be reached through it),
      # so npm's tarball install of the two packages — optionalDependencies,
      # the tarball's file list, binaryPath inside node_modules — was checked
      # nowhere on this platform. The builds come from the native job's own
      # artifact, kept out of native/bin so the gate below still skips its
      # registry-based install check.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-bin
          path: native/bin-win
      - run: node scripts/check-packed-install.mjs
        env:
          CODAR_NATIVE_OUT: native/bin-win
      # npm and tar are .cmd shims here, and the tarball carries CRLF paths:
      # this job runs the gate's Windows branches. It has no builds to stage,
      # so the install check is a skip here (the gate says so); the packed
      # suite is what this job checks.
      - run: node scripts/tarball.mjs

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: node --test

  # the plugin's own requests can go out through a small Go proxy that rebuilds
  # the Codar desktop sidecar's transport (native/cmd/codar-proxy). Its tests
  # pin what leaves the proxy — the sidecar's headers, its proxy decision, its
  # last-address dialer — and the build pins each platform's Go toolchain,
  # because a module's go directive decides which GODEBUG defaults the binary
  # carries, and those decide the TLS ClientHello.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.3"
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: cd native && go vet ./... && go test ./...
      # the Windows artifact must come from Go 1.26.7 under a go 1.24 module,
      # as the desktop's Windows sidecar does (its DefaultGODEBUG is the go
      # 1.24 set); the script refuses a build whose defaults are not the
      # platform sidecar's
      - run: node scripts/build-native.mjs --all
      - run: node scripts/build-native.mjs --check --strict
      # each file's own build record, read where the build is made rather than
      # two jobs later; the tarball job reads it again for the artifact it
      # downloads
      - run: node scripts/build-native.mjs --buildinfo
      # the tarball job packs these, so its gate checks a package that carries
      # the builds this job just verified
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-bin
          path: native/bin/
          if-no-files-found: error
